worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile on;
  keepalive_timeout 65;

  # Default request size limit.
  # Media uploads override this below.
  client_max_body_size 5m;

  # Structured access logging
  log_format main_ext
    '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
    'rt=$request_time urt=$upstream_response_time uaddr=$upstream_addr '
    'reqid=$request_id';

  access_log /var/log/nginx/access.log main_ext;
  error_log  /var/log/nginx/error.log warn;

  # Rate limiting
  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  upstream emall_upstream {
    server emall-app:8080;
    keepalive 64;
  }

  upstream trace_upstream {
    server grafana-lgtm:3000;
    keepalive 32;
  }

  server {
    listen 80;
    server_name _;

    # Timeouts
    proxy_connect_timeout 5s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;
    send_timeout          60s;

    # Common proxy settings for the monolith
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Request-Id $request_id;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;

    # Header sanitization: prevent clients from spoofing internal identity headers
    proxy_set_header X-User-Id    "";
    proxy_set_header X-User-Name  "";
    proxy_set_header X-User-Roles "";

    # Health check for the gateway itself
    location = /health {
      add_header Content-Type text/plain;
      return 200 "ok\n";
    }

    # -------------------------
    # Grafana / traces
    # -------------------------
    location = /trace {
      return 301 /trace/;
    }

    location /trace/api/live/ {
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;

      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_pass http://trace_upstream;
    }

    location /trace/ {
      if ($request_method !~ ^(GET|POST|PUT|PATCH|DELETE|OPTIONS)$) { return 405; }

      proxy_http_version 1.1;
      proxy_set_header Connection "";

      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Authorization $http_authorization;

      proxy_pass http://trace_upstream;
    }

    # Redirect prefix without trailing slash to trailing slash
    location ~ ^/(catalog|campaigns|accounts|order-hub|media-manager|interaction)$ {
      return 301 /$1/;
    }

    # -------------------------
    # Media route to the monolith
    # Kept separate only because uploads usually need a larger body size.
    # Public path stays /media-manager/...
    # Upstream receives /...
    # -------------------------
    location ^~ /media-manager/ {
      limit_req zone=api_limit burst=40 nodelay;
      client_max_body_size 20m;

      if ($request_method !~ ^(GET|POST|PUT|PATCH|DELETE|OPTIONS)$) { return 405; }

      proxy_set_header Host $host;
      proxy_set_header X-Request-Id $request_id;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Prefix /media-manager;
      proxy_set_header Authorization $http_authorization;

      proxy_set_header X-User-Id    "";
      proxy_set_header X-User-Name  "";
      proxy_set_header X-User-Roles "";

      rewrite ^/media-manager/(.*)$ /$1 break;
      proxy_pass http://emall_upstream;
    }

    # -------------------------
    # Existing public API prefixes to the monolith
    # Public path examples:
    #   /catalog/products/all
    #   /accounts/auth/login
    #   /campaigns/...
    #   /order-hub/...
    #   /interaction/...
    #
    # Because your old Nginx stripped the service prefix, this keeps the same behavior:
    #   /catalog/products/all -> emall-app:8080/products/all
    # -------------------------
    location ~ ^/(catalog|campaigns|accounts|order-hub|interaction)/(.*)$ {
      limit_req zone=api_limit burst=40 nodelay;

      if ($request_method !~ ^(GET|POST|PUT|PATCH|DELETE|OPTIONS)$) { return 405; }

      proxy_set_header Host $host;
      proxy_set_header X-Request-Id $request_id;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Prefix /$1;
      proxy_set_header Authorization $http_authorization;

      proxy_set_header X-User-Id    "";
      proxy_set_header X-User-Name  "";
      proxy_set_header X-User-Roles "";

      rewrite ^/[^/]+/(.*)$ /$1 break;
      proxy_pass http://emall_upstream;
    }

    location / {
      return 404 "not found\n";
    }
  }
}
