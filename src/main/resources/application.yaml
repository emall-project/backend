spring:
  jackson:
    time-zone: Asia/Gaza

  datasource:
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    properties:
      org:
        hibernate:
          envers:
            revision_type_field_name: revtype
            revision_field_name: rev
            track_entities_changed_in_revision: false

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml


  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:emall}
    password: ${SPRING_RABBITMQ_PASSWORD:emallpass}
    listener:
      simple:
        acknowledge-mode: auto
        default-requeue-rejected: false
        concurrency: 1
        max-concurrency: 4
        prefetch: 20

  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false

  servlet:
    multipart:
      max-file-size: 1MB


  mail:
    host: smtp.gmail.com
    port: 587
    username: lamahafiz2004@gmail.com
    password: ftevmfqaeanoapli
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health, info

app:
  jwt:
    secret: ${JWT_SECRET}
  mail:
    from: lamahafiz2004@gmail.com
    from-name: E-Malls Platform

  otp:
    expiration: 300000
    length: 6


stripe:
  secret:
    key: ${STRIPE_SECRET_KEY}
  webhook:
    secret: ${STRIPE_WEBHOOK_SECRET}


aws:
  s3:
    bucket: ${AWS_BUCKET_NAME:emall-media}
    region: ${AWS_REGION_NAME:eu-north-1}
    access-key: ${AWS_ACCESS_KEY_ID}
    secret-key: ${AWS_SECRET_ACCESS_KEY}

media:
  cdn:
    base-url: ${MEDIA_CDN_BASE_URL:}
    key-pair-id: ${CLOUDFRONT_KEY_PAIR_ID:}
    private-key: ${CLOUDFRONT_PRIVATE_KEY:}
    signed-url-ttl-seconds: ${MEDIA_SIGNED_URL_TTL_SECONDS:300}
  cache-control:
    public: ${MEDIA_PUBLIC_CACHE_CONTROL:public, max-age=31536000, immutable}
    private: ${MEDIA_PRIVATE_CACHE_CONTROL:private, max-age=300}


models:
  product-similarity-engine:
    url: ${PRODUCT_SIMILARITY_ENGINE_HOST:https://product-similarity-engine-github-963793636631.europe-west1.run.app}
    username: ${PRODUCT_SIMILARITY_ENGINE_USER_NAME:admin}
    password: ${PRODUCT_SIMILARITY_ENGINE_PASSWORD:change-me-in-prod}

moderation:
  openai:
    api-key: ${OPENAI_MODERATION_API_KEY:}

  worker:
    transaction-commit-delay-ms: 300
    delay-between-calls-ms: 1200

  scheduler:
    max-retries: 3              # AI called at most 3 times per comment on failure
    retry-interval-minutes: 10  # Wait 10 min between retries
    retry-interval-ms: 600000   # Same value in milliseconds for @Scheduled

internal:
  auth:
    username: ${INTERNAL_SERVICE_USERNAME:e-mall-internal}
    password: ${INTERNAL_SERVICE_PASSWORD:s3cr3t-internal-p@ss}
